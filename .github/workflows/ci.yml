name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          # Demo mode — no real API key needed in CI
          WHETSTONE_DEMO: "1"
